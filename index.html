<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NI Predict">
<meta name="theme-color" content="#060810">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.svg">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<title>LME Nickel Predictor</title>
<style>
:root{--bg:#060810;--s1:#0c0f1a;--s2:#111520;--border:#1c2238;--accent:#00c8ff;--gold:#f0a020;--green:#00e676;--red:#ff3d57;--purple:#b060ff;--muted:#2a3350;--text:#dde4f4;--sub:#5a6888;--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#header{padding:calc(var(--safe-top) + 12px) 16px 12px;background:var(--s1);border-bottom:1px solid var(--border);flex-shrink:0}
.hrow{display:flex;align-items:center;gap:8px}
.htitle{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:var(--accent);letter-spacing:1px}
.hsub{font-size:9px;color:var(--sub);margin-top:1px;font-family:'Space Mono',monospace}
.hicon{font-size:18px;filter:drop-shadow(0 0 5px var(--accent))}
.date-row{display:flex;gap:6px;margin-top:10px;align-items:center}
.date-inp{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 8px;color:var(--text);font-size:11px;font-family:'Space Mono',monospace;-webkit-appearance:none;outline:none}
.date-inp:focus{border-color:var(--accent)}
.run-btn{padding:7px 14px;background:var(--accent);border:none;border-radius:6px;color:var(--bg);font-weight:700;font-size:11px;font-family:'Space Mono',monospace;cursor:pointer;white-space:nowrap;-webkit-appearance:none}
.run-btn:active{opacity:.7}
.run-btn.running{background:var(--muted);color:var(--sub)}
.run-btn.done{background:var(--green)}
.today-btn{padding:6px 10px;background:none;border:1px solid var(--border);border-radius:6px;color:var(--sub);font-size:10px;font-family:'Space Mono',monospace;cursor:pointer;white-space:nowrap}
#pw{height:2px;background:var(--muted);flex-shrink:0;display:none}
#pf{height:2px;background:var(--accent);width:0%;transition:width .4s;box-shadow:0 0 8px var(--accent)}
#tabbar{display:flex;overflow-x:auto;scrollbar-width:none;background:var(--s1);border-bottom:1px solid var(--border);flex-shrink:0}
#tabbar::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:11px 14px;background:none;border:none;border-bottom:2px solid transparent;color:var(--sub);font-size:10px;font-family:'Space Mono',monospace;cursor:pointer;white-space:nowrap}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
#content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:14px}
#content::-webkit-scrollbar{display:none}
#navbar{display:flex;background:var(--s1);border-top:1px solid var(--border);padding-bottom:var(--safe-bot);flex-shrink:0}
.nav{flex:1;padding:9px 0 7px;background:none;border:none;color:var(--sub);font-size:9px;font-family:'Space Mono',monospace;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav.active{color:var(--accent)}
.nav .ni{font-size:16px}
.card{background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.ctitle{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--accent);margin-bottom:12px}
.kpi{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:11px 8px;text-align:center}
.kpi.pass{border-color:rgba(0,230,118,.35);background:rgba(0,230,118,.04)}
.kpi.fail{border-color:rgba(255,61,87,.35);background:rgba(255,61,87,.04)}
.kv{font-family:'Space Mono',monospace;font-size:19px;font-weight:700}
.kl{font-size:9px;color:var(--sub);margin-top:2px}
.ks{font-size:10px;color:var(--sub);margin-top:5px}
.tbl{width:100%;border-collapse:collapse;font-size:11px}
.tbl th{padding:6px 7px;color:var(--sub);font-weight:400;font-family:'Space Mono',monospace;font-size:9px;border-bottom:1px solid var(--border);text-align:right}
.tbl th:first-child{text-align:left}
.tbl td{padding:7px 7px;border-bottom:1px solid rgba(28,34,56,.5);text-align:right}
.tbl td:first-child{text-align:left;font-family:'Space Mono',monospace;color:var(--accent)}
.tbl tr:last-child td{border-bottom:none}
.sc-card{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px}
.sc-slider{width:100%;-webkit-appearance:none;height:4px;border-radius:2px;outline:none;margin:8px 0;background:var(--muted)}
.sc-slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid var(--bg)}
.wi-result{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:8px}
.wi-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(28,34,56,.4)}
.wi-row:last-child{border-bottom:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fadeIn .25s ease forwards}
</style>
</head>
<body>
<div id="app">
<div id="header">
  <div class="hrow">
    <span class="hicon">⬡</span>
    <div><div class="htitle">LME NICKEL CLASS 1</div><div class="hsub" id="hdate">BACKTEST · ENSEMBLE v2 · GAME THEORY v2</div></div>
  </div>
  <div class="date-row">
    <input class="date-inp" type="date" id="dateFrom">
    <span style="color:var(--sub);font-size:11px">~</span>
    <input class="date-inp" type="date" id="dateTo">
    <button class="today-btn" onclick="setToday()">오늘</button>
    <button class="run-btn" id="runBtn" onclick="runBacktest()">▶ 실행</button>
  </div>
</div>
<div id="pw"><div id="pf"></div></div>
<div id="tabbar">
  <div class="tab active" onclick="switchTab('overview')">개요</div>
  <div class="tab" onclick="switchTab('whatif')">What-If</div>
  <div class="tab" onclick="switchTab('mape')">MAPE</div>
  <div class="tab" onclick="switchTab('regime')">레짐</div>
  <div class="tab" onclick="switchTab('gt')">게임이론</div>
  <div class="tab" onclick="switchTab('strategy')">전략</div>
  <div class="tab" onclick="switchTab('price')">가격</div>
</div>
<div id="content">
  <div style="text-align:center;padding:50px 20px;color:var(--sub)" id="placeholder">
    <div style="font-size:32px;margin-bottom:12px">📊</div>
    <div style="font-size:13px">날짜 설정 후 ▶ 실행을 누르세요<br><br>
    <span style="font-size:11px;color:var(--muted)">기간 미설정 시 2018~오늘 전체 실행</span></div>
  </div>
</div>
<div id="navbar">
  <button class="nav active" id="nav-overview" onclick="switchTab('overview')"><span class="ni">◈</span><span>개요</span></button>
  <button class="nav" id="nav-whatif" onclick="switchTab('whatif')"><span class="ni">🎲</span><span>What-If</span></button>
  <button class="nav" id="nav-mape" onclick="switchTab('mape')"><span class="ni">📉</span><span>MAPE</span></button>
  <button class="nav" id="nav-gt" onclick="switchTab('gt')"><span class="ni">⚖</span><span>게임론</span></button>
  <button class="nav" id="nav-strategy" onclick="switchTab('strategy')"><span class="ni">💹</span><span>전략</span></button>
</div>
</div>
<script src="app.js"></script>
</body>
</html>
