<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NI Predict">
<meta name="theme-color" content="#f8fffe">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.svg">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@300;400;500&family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">
<title>NI Predict</title>
<style>
:root {
  --bg:       #f8fffe;
  --bg2:      #f0fdfb;
  --surface:  rgba(255,255,255,0.90);
  --border:   rgba(13,148,136,0.12);
  --teal:     #0d9488;
  --teal-lt:  rgba(13,148,136,0.10);
  --teal-xl:  rgba(13,148,136,0.05);
  --blue:     #3b82f6;
  --blue-lt:  rgba(59,130,246,0.10);
  --sky:      #0ea5e9;
  --green:    #059669;
  --red:      #e11d48;
  --amber:    #d97706;
  --purple:   #7c3aed;
  --text:     #0f2027;
  --text2:    #334155;
  --text3:    #64748b;
  --text4:    #94a3b8;
  --safe-top: env(safe-area-inset-top,0px);
  --safe-bot: env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;overflow:hidden;
  background:linear-gradient(160deg,#f0fdfb 0%,#eff6ff 60%,#f8fffe 100%);
  color:var(--text);font-family:'Pretendard','Noto Sans KR',sans-serif;
  overscroll-behavior:none;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 15% 15%,rgba(13,148,136,0.07) 0%,transparent 45%),
    radial-gradient(circle at 85% 85%,rgba(59,130,246,0.07) 0%,transparent 45%);
}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;position:relative;z-index:1}

/* 헤더 */
#header{
  padding:calc(var(--safe-top) + 12px) 18px 12px;
  background:var(--surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.h-row{display:flex;align-items:center;gap:10px}
.h-logo{
  width:32px;height:32px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,var(--teal),var(--sky));
  display:flex;align-items:center;justify-content:center;font-size:15px;
  box-shadow:0 2px 8px rgba(13,148,136,0.25);
}
.h-title{font-family:'DM Serif Display',serif;font-size:16px;color:var(--text)}
.h-sub{font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:1px}
.regime-pill{
  margin-left:auto;font-size:9px;font-family:'DM Mono',monospace;
  padding:3px 9px;border-radius:20px;white-space:nowrap;
  background:var(--teal-lt);color:var(--teal);border:1px solid rgba(13,148,136,0.2);
}

/* 날짜 + 실행 */
.ctrl-row{display:flex;gap:8px;align-items:center;margin-top:10px}
.date-lbl{font-size:10px;color:var(--text3);white-space:nowrap}
.date-inp{
  flex:1;background:var(--bg2);border:1px solid var(--border);
  border-radius:8px;padding:7px 10px;color:var(--text2);
  font-size:12px;font-family:'DM Mono',monospace;
  -webkit-appearance:none;outline:none;
}
.date-inp:focus{border-color:rgba(13,148,136,0.4)}
.run-btn{
  padding:8px 18px;
  background:linear-gradient(135deg,var(--teal),var(--sky));
  border:none;border-radius:8px;color:#fff;font-weight:600;
  font-size:12px;font-family:'DM Mono',monospace;cursor:pointer;
  white-space:nowrap;box-shadow:0 2px 8px rgba(13,148,136,0.3);
  transition:opacity .15s;
}
.run-btn:active{opacity:.75}
.run-btn.running{background:linear-gradient(135deg,#94a3b8,#94a3b8);box-shadow:none}
.run-btn.done{background:linear-gradient(135deg,var(--green),#10b981)}

/* 진행바 */
#pw{height:2px;background:rgba(13,148,136,0.08);flex-shrink:0;display:none}
#pf{height:2px;background:linear-gradient(90deg,var(--teal),var(--sky));width:0%;transition:width .4s}

/* 탭 (4개만) */
#tabbar{
  display:flex;background:var(--surface);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);flex-shrink:0;
}
.tab{
  flex:1;padding:12px 0;background:none;border:none;
  border-bottom:2px solid transparent;color:var(--text3);
  font-size:10px;font-family:'DM Mono',monospace;
  cursor:pointer;transition:all .15s;text-align:center;letter-spacing:.3px;
}
.tab.active{color:var(--teal);border-bottom-color:var(--teal);font-weight:500}

/* 콘텐츠 */
#content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:16px}
#content::-webkit-scrollbar{display:none}

/* 카드 */
.card{
  background:var(--surface);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;
  box-shadow:0 1px 4px rgba(0,0,0,0.04),0 0 20px rgba(13,148,136,0.04);
}
.card-title{
  font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;
  color:var(--teal);margin-bottom:12px;text-transform:uppercase;
}

/* 예측 결과 행 */
.pred-row{
  display:flex;align-items:center;padding:10px 0;
  border-bottom:1px solid rgba(13,148,136,0.07);
}
.pred-row:last-child{border-bottom:none}
.pred-horizon{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);width:36px;flex-shrink:0}
.pred-bar-wrap{flex:1;height:4px;background:rgba(13,148,136,0.08);border-radius:2px;overflow:hidden;margin:0 10px}
.pred-bar{height:4px;border-radius:2px;transition:width .8s ease}
.pred-price{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;width:80px;text-align:right;flex-shrink:0}
.pred-chg{font-family:'DM Mono',monospace;font-size:11px;width:50px;text-align:right;flex-shrink:0}

/* 자연어 설명 박스 */
.explain-box{
  background:linear-gradient(135deg,rgba(13,148,136,0.05),rgba(59,130,246,0.05));
  border:1px solid rgba(13,148,136,0.12);border-radius:12px;
  padding:14px;margin-top:12px;
}
.explain-text{font-size:13px;color:var(--text2);line-height:1.8}
.explain-highlight{
  display:inline-block;padding:1px 6px;border-radius:4px;font-weight:600;
  background:rgba(13,148,136,0.1);color:var(--teal);font-family:'DM Mono',monospace;
}

/* MAPE 테이블 */
.mape-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(13,148,136,0.07)}
.mape-row:last-child{border-bottom:none}
.mape-h{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);width:36px;flex-shrink:0}
.mape-bar-track{flex:1;height:5px;background:rgba(13,148,136,0.08);border-radius:3px;overflow:hidden}
.mape-bar-fill{height:5px;border-radius:3px;transition:width .8s ease}
.mape-val{font-family:'DM Mono',monospace;font-size:12px;font-weight:500;width:44px;text-align:right;flex-shrink:0}
.mape-target{font-size:10px;color:var(--text4);width:50px;text-align:right;flex-shrink:0}
.pass-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* 변수 태그 */
.var-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.var-tag{
  padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500;
  border:1px solid;display:flex;align-items:center;gap:4px;
}

/* What-If 슬라이더 */
.scenario{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px}
.sc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.sc-name{font-size:14px;font-weight:600;color:var(--text)}
.sc-desc{font-size:11px;color:var(--text3);margin-top:3px;line-height:1.5}
.sc-slider{
  width:100%;-webkit-appearance:none;height:3px;border-radius:2px;
  outline:none;margin:12px 0 6px;cursor:pointer;
}
.sc-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:white;border:2.5px solid var(--teal);cursor:pointer;
  box-shadow:0 2px 6px rgba(13,148,136,0.3);
}
.sc-result{
  display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;
  background:var(--bg2);border-radius:10px;padding:10px 12px;
}
.sc-kpi{flex:1;min-width:60px;text-align:center}
.sc-kpi-val{font-family:'DM Mono',monospace;font-size:15px;font-weight:500}
.sc-kpi-lbl{font-size:9px;color:var(--text3);margin-top:2px}

/* 게임이론 */
.gt-strategy-list{display:flex;flex-direction:column;gap:8px}
.gt-strategy{
  background:var(--bg2);border:1.5px solid var(--border);
  border-radius:12px;padding:14px;cursor:pointer;transition:all .2s;
}
.gt-strategy.selected{border-color:var(--teal);background:rgba(13,148,136,0.04)}
.gt-strategy:active{opacity:.8}
.gt-st-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.gt-st-icon{font-size:20px}
.gt-st-name{font-size:14px;font-weight:600;color:var(--text)}
.gt-st-badge{
  margin-left:auto;font-size:9px;padding:2px 8px;border-radius:20px;
  font-family:'DM Mono',monospace;
}
.gt-st-desc{font-size:12px;color:var(--text3);line-height:1.6}
.gt-st-alpha{
  margin-top:8px;font-family:'DM Mono',monospace;font-size:11px;
  display:flex;align-items:center;gap:6px;
}

/* 알파 게이지 */
.alpha-gauge{
  flex:1;height:4px;border-radius:2px;
  background:linear-gradient(to right,var(--green),rgba(13,148,136,0.1),var(--red));
  position:relative;
}
.alpha-dot{
  position:absolute;top:50%;transform:translate(-50%,-50%);
  width:10px;height:10px;border-radius:50%;
  background:white;border:2px solid;transition:left .5s ease;
  box-shadow:0 1px 4px rgba(0,0,0,0.15);
}

/* 데이터 탭 */
.price-stat{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid rgba(13,148,136,0.07);
}
.price-stat:last-child{border-bottom:none}
.news-item{
  padding:10px 0;border-bottom:1px solid rgba(13,148,136,0.07);
}
.news-item:last-child{border-bottom:none}
.news-date{font-family:'DM Mono',monospace;font-size:9px;color:var(--text4);margin-bottom:3px}
.news-title{font-size:12px;color:var(--text2);line-height:1.5}
.news-tag{
  display:inline-block;margin-top:4px;padding:2px 7px;border-radius:3px;
  font-size:9px;font-family:'DM Mono',monospace;
}

/* 플레이스홀더 */
#placeholder{text-align:center;padding:70px 20px}
.ph-icon{font-size:44px;margin-bottom:14px}
.ph-title{font-family:'DM Serif Display',serif;font-size:22px;color:var(--text);margin-bottom:8px}
.ph-sub{font-size:13px;color:var(--text3);line-height:1.7}

/* 팝업 */
#help-overlay{
  position:fixed;inset:0;z-index:999;
  background:rgba(15,32,39,0.4);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.help-sheet{
  position:absolute;bottom:0;left:0;right:0;
  background:var(--bg);border-radius:24px 24px 0 0;
  max-height:80vh;display:flex;flex-direction:column;
  padding-bottom:var(--safe-bot);
  animation:slideUp .3s cubic-bezier(.32,1,.5,1);
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.help-handle{width:36px;height:4px;background:rgba(0,0,0,0.1);border-radius:2px;margin:12px auto}
.help-hdr{padding:0 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.help-title{font-family:'DM Serif Display',serif;font-size:17px;color:var(--text)}
.help-x{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,0.06);border:none;cursor:pointer;font-size:14px;color:var(--text3)}
.help-body{overflow-y:auto;padding:14px 18px 20px;-webkit-overflow-scrolling:touch}
.help-section{background:white;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.help-sh{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.help-sbody{font-size:12px;color:var(--text3);line-height:1.8;white-space:pre-line}

/* 애니메이션 */
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fadeUp .22s ease forwards}
</style>
</head>
<body>
<div id="app">

<!-- 헤더 -->
<div id="header">
  <div class="h-row">
    <div class="h-logo">⬡</div>
    <div>
      <div class="h-title">NI Predict</div>
      <div class="h-sub" id="hdate">LME NICKEL · ENSEMBLE v2 + GAME THEORY</div>
    </div>
    <div class="regime-pill" id="regime-pill">준비</div>
  </div>
  <div class="ctrl-row">
    <span class="date-lbl">기준일</span>
    <input class="date-inp" type="date" id="dateRef">
    <button class="run-btn" id="runBtn" onclick="runBacktest()">▶ 예측 실행</button>
    <button style="background:none;border:none;font-size:18px;cursor:pointer;color:var(--text3);padding:4px" onclick="showHelp(S.tab)">?</button>
  </div>
</div>

<!-- 진행바 -->
<div id="pw"><div id="pf"></div></div>

<!-- 탭 (4개) -->
<div id="tabbar">
  <div class="tab active" onclick="switchTab('predict')">📊 예측</div>
  <div class="tab" onclick="switchTab('whatif')">🎲 What-If</div>
  <div class="tab" onclick="switchTab('strategy')">⚖ 전략</div>
  <div class="tab" onclick="switchTab('data')">📰 데이터</div>
</div>

<!-- 콘텐츠 -->
<div id="content">
  <div id="placeholder">
    <div class="ph-icon">🔮</div>
    <div class="ph-title">날짜를 선택하세요</div>
    <div class="ph-sub">기준일 하나만 고르면<br>D+1부터 D+63까지 자동으로 예측해요</div>
  </div>
</div>

</div>
<script src="help.js"></script>
<script src="app.js"></script>
</body>
</html>
